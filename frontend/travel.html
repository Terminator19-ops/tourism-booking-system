<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel – Tourism Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="trips.html">Trips</a>
            <a href="hotels.html">Hotels</a>
            <a href="tours.html">Tours</a>
            <a href="travel.html">Travel</a>
            <a href="activities.html">Activities</a>
            <a href="profile.html">Profile</a>
        </div>

        <div id="listView">
            <h1>Travel Options</h1>

            <!-- Filters -->
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;">
                <input type="text"  id="filterOrigin"  placeholder="Origin"      style="width:140px;">
                <input type="text"  id="filterDest"    placeholder="Destination" style="width:140px;">
                <select id="filterType" style="width:120px;padding:7px 9px;border:1px solid #bbb;">
                    <option value="">All types</option>
                    <option value="Flight">Flight</option>
                    <option value="Train">Train</option>
                    <option value="Bus">Bus</option>
                </select>
                <button id="filterBtn">Filter</button>
                <button id="clearBtn">Clear</button>
            </div>

            <div id="travelListContainer"></div>
        </div>

        <!-- Booking Form -->
        <div id="bookingView" class="hidden">
            <button id="backBtn">← Back to Travel</button>
            <h2 style="margin-top:12px;" id="bookSegmentLabel"></h2>
            <div class="form-group">
                <label>Passenger Name</label>
                <input type="text" id="passengerName" placeholder="Full name">
            </div>
            <div class="form-group">
                <label>Travel Date</label>
                <input type="date" id="travelDate">
            </div>
            <div class="form-group">
                <label>Seats</label>
                <input type="number" id="seats" min="1" max="10" value="1" style="width:80px;">
            </div>
            <div id="bookMsg"></div>
            <button class="primary" id="confirmBtn">Confirm Booking</button>
            <button id="cancelBtn">Cancel</button>
        </div>
    </div>
    <script src="js/travel.js"></script>
</body>
</html>
