<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile – Tourism Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="trips.html">Trips</a>
            <a href="hotels.html">Hotels</a>
            <a href="tours.html">Tours</a>
            <a href="travel.html">Travel</a>
            <a href="activities.html">Activities</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" id="adminNavLink" class="hidden">Admin</a>
        </div>

        <h1>My Profile</h1>

        <div id="profileInfo">
            <p><strong>First Name:</strong> <span id="userFirstName"></span></p>
            <p><strong>Last Name:</strong> <span id="userLastName"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Phone:</strong> <span id="userPhone"></span></p>
            <p><strong>Role:</strong> <span id="userRole"></span></p>
            <button class="primary" id="editProfileBtn" style="margin-top:12px;">Edit Profile</button>
        </div>

        <div id="editProfileForm" class="hidden section-sep">
            <h2>Edit Profile</h2>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="editFirstName">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="editLastName">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="editPhone">
            </div>
            <div id="editMsg"></div>
            <button class="primary" id="saveProfileBtn">Save</button>
            <button id="cancelEditBtn">Cancel</button>
        </div>

        <div class="section-sep">
            <h2>Change Password</h2>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="oldPassword" placeholder="Current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="New password">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <div id="pwdMsg"></div>
            <button class="primary" id="changePwdBtn">Change Password</button>
        </div>

        <div class="section-sep">
            <button class="danger" id="logoutBtn">Logout</button>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
